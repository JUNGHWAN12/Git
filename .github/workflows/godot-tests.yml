name: godot-tests

on:
  push:
    paths:
      - "game/**"
      - ".github/workflows/godot-tests.yml"
  pull_request:
    paths:
      - "game/**"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4

      - name: Godot 내려받기
        run: |
          curl -sSL -o godot.zip "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          ./godot --version

      - name: 프로젝트 가져오기
        run: ./godot --headless --path game --import || true

      - name: 테스트 실행
        run: |
          ./godot --headless --path game --script res://tests/run_tests.gd 2>&1 | tee test-output.txt
          grep -Eq "RESULT: passed=[1-9][0-9]* failed=0" test-output.txt
